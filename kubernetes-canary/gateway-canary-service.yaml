apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: emerald-housing
  labels:
    app.kubernetes.io/name: api-gateway-canary
spec:
  type: ClusterIP
  selector:
    app: api-gateway-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
