spring:
  application:
    name: member-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${MEMBER_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${MEMBER_REDIS_COMMAND_TIMEOUT:500ms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true

server:
  port: ${MEMBER_SERVER_PORT:8082}
  shutdown: graceful
  tomcat:
    threads:
      max: ${MEMBER_HTTP_MAX_THREADS:100}
    max-connections: ${MEMBER_HTTP_MAX_CONNECTIONS:500}
    accept-count: ${MEMBER_HTTP_ACCEPT_COUNT:50}

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n%ex"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${TRACING_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}

app:
  datasource:
    writer:
      jdbc-url: ${MEMBER_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/member_db}
      username: ${MEMBER_DB_USERNAME:emerald}
      password: ${MEMBER_DB_PASSWORD:emerald_local}
      maximum-pool-size: ${MEMBER_DB_POOL_MAX_SIZE:8}
      minimum-idle: ${MEMBER_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${MEMBER_DB_POOL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${MEMBER_DB_POOL_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${MEMBER_DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${MEMBER_DB_POOL_MAX_LIFETIME:1800000}
    reader:
      enabled: ${MEMBER_DB_REPLICA_ENABLED:false}
      jdbc-url: ${MEMBER_DB_REPLICA_URL:}
      username: ${MEMBER_DB_REPLICA_USERNAME:${MEMBER_DB_USERNAME:emerald}}
      password: ${MEMBER_DB_REPLICA_PASSWORD:${MEMBER_DB_PASSWORD:emerald_local}}
      maximum-pool-size: ${MEMBER_DB_REPLICA_POOL_MAX_SIZE:4}
      minimum-idle: ${MEMBER_DB_REPLICA_POOL_MIN_IDLE:1}
      connection-timeout: ${MEMBER_DB_POOL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${MEMBER_DB_POOL_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${MEMBER_DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${MEMBER_DB_POOL_MAX_LIFETIME:1800000}
  member:
    # Indian mobile format by default: 10 digits beginning with 6, 7, 8, or 9.
    mobile-number-regex: '^[6-9][0-9]{9}$'
  idempotency:
    ttl: ${IDEMPOTENCY_RECORD_TTL:24h}

resilience:
  society:
    sliding-window-size: ${SOCIETY_CB_WINDOW_SIZE:10}
    minimum-calls: ${SOCIETY_CB_MINIMUM_CALLS:5}
    failure-rate-threshold: ${SOCIETY_CB_FAILURE_RATE:50}
    slow-call-rate-threshold: ${SOCIETY_CB_SLOW_CALL_RATE:60}
    slow-call-duration: ${SOCIETY_CB_SLOW_CALL_DURATION:2s}
    open-state-wait: ${SOCIETY_CB_OPEN_WAIT:15s}
    half-open-permitted-calls: ${SOCIETY_CB_HALF_OPEN_CALLS:2}
    retry-max-attempts: ${SOCIETY_RETRY_MAX_ATTEMPTS:3}
    retry-initial-interval: ${SOCIETY_RETRY_INITIAL_INTERVAL:200ms}
    retry-multiplier: ${SOCIETY_RETRY_MULTIPLIER:2.0}
    retry-jitter: ${SOCIETY_RETRY_JITTER:0.2}
    retry-max-interval: ${SOCIETY_RETRY_MAX_INTERVAL:1s}
    bulkhead-max-concurrent-calls: ${SOCIETY_BULKHEAD_MAX_CONCURRENT:12}
    bulkhead-max-wait: ${SOCIETY_BULKHEAD_MAX_WAIT:0ms}

society:
  service:
    base-url: ${SOCIETY_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout: ${SOCIETY_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SOCIETY_SERVICE_READ_TIMEOUT:3s}

membership:
  lock:
    wait-time: ${MEMBERSHIP_LOCK_WAIT:2s}
    lease-time: ${MEMBERSHIP_LOCK_LEASE:30s}

emerald:
  security:
    gateway-session-validation-url: ${GATEWAY_SESSION_VALIDATION_URL:http://localhost:8080/internal/auth/session}
    session-cookie-name: ${SESSION_COOKIE_NAME:SESSION}
    session-validation-token: ${SESSION_VALIDATION_TOKEN:}
    gateway-authentication-token: ${GATEWAY_AUTHENTICATION_TOKEN:}
    member-flat-read-token: ${MEMBER_TO_SOCIETY_TOKEN:}
    validation-connect-timeout: ${SESSION_VALIDATION_CONNECT_TIMEOUT:2s}
    validation-read-timeout: ${SESSION_VALIDATION_READ_TIMEOUT:3s}
    provisioning:
      username: ${ADMIN_PROVISIONING_USERNAME:}
      password: ${ADMIN_PROVISIONING_PASSWORD:}
