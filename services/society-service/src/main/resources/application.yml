spring:
  main:
    keep-alive: ${SPRING_MAIN_KEEP_ALIVE:true}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  application:
    name: society-service
  datasource:
    url: ${SOCIETY_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/society_db}
    username: ${SOCIETY_DB_USERNAME:emerald}
    password: ${SOCIETY_DB_PASSWORD:emerald_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${SOCIETY_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${SOCIETY_REDIS_COMMAND_TIMEOUT:500ms}
      lettuce:
        pool:
          max-active: ${SOCIETY_REDIS_POOL_MAX_ACTIVE:12}
          max-idle: ${SOCIETY_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${SOCIETY_REDIS_POOL_MIN_IDLE:1}
          max-wait: ${SOCIETY_REDIS_POOL_MAX_WAIT:500ms}

server:
  port: ${SOCIETY_SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    max-connections: ${SOCIETY_HTTP_MAX_CONNECTIONS:500}
    accept-count: ${SOCIETY_HTTP_ACCEPT_COUNT:50}

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n%ex"

app:
  instance:
    id: ${INSTANCE_ID:local}
    header-enabled: ${INSTANCE_HEADER_ENABLED:true}

emerald:
  security:
    gateway-session-validation-url: ${GATEWAY_SESSION_VALIDATION_URL:http://localhost:8080/internal/auth/session}
    session-cookie-name: ${SESSION_COOKIE_NAME:SESSION}
    session-validation-token: ${SESSION_VALIDATION_TOKEN:}
    member-flat-read-token: ${MEMBER_TO_SOCIETY_TOKEN:}
    validation-connect-timeout: ${SESSION_VALIDATION_CONNECT_TIMEOUT:2s}
    validation-read-timeout: ${SESSION_VALIDATION_READ_TIMEOUT:3s}
