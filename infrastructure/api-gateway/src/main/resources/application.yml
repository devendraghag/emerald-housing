spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    redis:
      namespace: emerald:gateway:session
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:28s}
          routes:
            - id: member-api
              uri: ${MEMBER_SERVICE_URL:http://localhost:8082}
              order: -10
              predicates:
                - Path=/api/v1/members,/api/v1/members/**,/api/v1/flats/*/memberships/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authenticatedAdminKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_MEMBER_RATE_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_MEMBER_RATE_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
            - id: society-api
              uri: ${SOCIETY_SERVICE_URL:http://localhost:8081}
              order: 0
              predicates:
                - Path=/api/v1/society,/api/v1/society/**,/api/v1/floors,/api/v1/floors/**,/api/v1/flats,/api/v1/flats/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authenticatedAdminKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_SOCIETY_RATE_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_SOCIETY_RATE_BURST:40}
                    redis-rate-limiter.requestedTokens: 1

emerald:
  security:
    member-credential-url: ${MEMBER_CREDENTIAL_URL:http://localhost:8082/internal/auth/credentials}
    gateway-authentication-token: ${GATEWAY_AUTHENTICATION_TOKEN:}
    session-validation-token: ${SESSION_VALIDATION_TOKEN:}
    session-cookie-name: ${SESSION_COOKIE_NAME:SESSION}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    credential-connect-timeout: ${CREDENTIAL_CONNECT_TIMEOUT:2s}
    credential-response-timeout: ${CREDENTIAL_RESPONSE_TIMEOUT:3s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  level:
    root: INFO
