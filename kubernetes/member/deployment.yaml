apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: emerald-housing
  labels:
    app.kubernetes.io/name: member-service
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service
        app.kubernetes.io/name: member-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: member-service
          image: emerald/member-service:step4-audit
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: emerald-app-config
          env:
            - name: SOCIETY_SERVICE_CONNECT_TIMEOUT
              value: 2s
            - name: SOCIETY_SERVICE_READ_TIMEOUT
              value: 3s
            - name: MEMBER_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: emerald-db-credentials
                  key: member-username
            - name: MEMBER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emerald-db-credentials
                  key: member-password
            - name: SESSION_VALIDATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: emerald-security-credentials
                  key: session-validation-token
            - name: GATEWAY_AUTHENTICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: emerald-security-credentials
                  key: gateway-authentication-token
            - name: MEMBER_TO_SOCIETY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: emerald-security-credentials
                  key: member-to-society-token
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emerald-security-credentials
                  key: redis-password
            - name: ADMIN_PROVISIONING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: emerald-security-credentials
                  key: admin-username
            - name: ADMIN_PROVISIONING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emerald-security-credentials
                  key: admin-password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
