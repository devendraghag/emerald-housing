apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: emerald-housing
data:
  MEMBER_SERVICE_URL: "http://member-service:8080"
  SOCIETY_SERVICE_URL: "http://society-service:8080"
  MEMBER_CREDENTIAL_URL: "http://member-service:8080/internal/auth/credentials"
  SERVER_PORT: "8080"
  SERVER_FORWARD_HEADERS_STRATEGY: "FRAMEWORK"
  SESSION_TIMEOUT: "30m"
  SESSION_COOKIE_NAME: "SESSION"
  SESSION_COOKIE_SECURE: "true"
  GATEWAY_CONNECT_TIMEOUT_MS: "2000"
  GATEWAY_RESPONSE_TIMEOUT: "5s"
  CREDENTIAL_CONNECT_TIMEOUT: "2s"
  CREDENTIAL_RESPONSE_TIMEOUT: "3s"
