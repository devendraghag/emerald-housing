apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: emerald-housing
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  TRACING_OTLP_ENABLED: "false"
  TRACING_SAMPLING_PROBABILITY: "0.1"
  INSTANCE_ID: "api-gateway"
  MEMBER_SERVICE_URL: "http://member-service:8080"
  SOCIETY_SERVICE_URL: "http://society-service:8080"
  MEMBER_CREDENTIAL_URL: "http://member-service:8080/internal/auth/credentials"
  SERVER_PORT: "8080"
  SERVER_FORWARD_HEADERS_STRATEGY: "FRAMEWORK"
  SESSION_TIMEOUT: "30m"
  SESSION_COOKIE_NAME: "SESSION"
  SESSION_COOKIE_SECURE: "true"
  GATEWAY_CONNECT_TIMEOUT_MS: "2000"
  GATEWAY_RESPONSE_TIMEOUT: "28s"
  GATEWAY_MEMBER_RATE_REPLENISH: "10"
  GATEWAY_MEMBER_RATE_BURST: "20"
  GATEWAY_SOCIETY_RATE_REPLENISH: "20"
  GATEWAY_SOCIETY_RATE_BURST: "40"
  GATEWAY_LOGIN_RATE_REPLENISH: "1"
  GATEWAY_LOGIN_RATE_BURST: "3"
  CREDENTIAL_CONNECT_TIMEOUT: "2s"
  CREDENTIAL_RESPONSE_TIMEOUT: "3s"
