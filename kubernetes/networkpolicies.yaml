apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: society-ingress-from-applications
  namespace: emerald-housing
spec:
  podSelector:
    matchLabels:
      app: society-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: member-service
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: member-ingress-from-gateway
  namespace: emerald-housing
spec:
  podSelector:
    matchLabels:
      app: member-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8080
