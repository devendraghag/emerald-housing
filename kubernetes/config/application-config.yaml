apiVersion: v1
kind: ConfigMap
metadata:
  name: emerald-app-config
  namespace: emerald-housing
data:
  # Verified from a kind Pod on this Docker Desktop host; use a reachable host name/IP elsewhere.
  POSTGRES_HOST: "host.docker.internal"
  SOCIETY_SERVICE_BASE_URL: "http://society-service:8080"
  GATEWAY_SESSION_VALIDATION_URL: "http://api-gateway:8080/internal/auth/session"
  SESSION_COOKIE_NAME: "SESSION"
  SESSION_COOKIE_SECURE: "false"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SOCIETY_SERVER_PORT: "8080"
  MEMBER_SERVER_PORT: "8080"
  INSTANCE_HEADER_ENABLED: "true"
  IDEMPOTENCY_RECORD_TTL: "24h"
  SOCIETY_CB_WINDOW_SIZE: "10"
  SOCIETY_CB_MINIMUM_CALLS: "5"
  SOCIETY_CB_FAILURE_RATE: "50"
  SOCIETY_CB_SLOW_CALL_RATE: "60"
  SOCIETY_CB_SLOW_CALL_DURATION: "2s"
  SOCIETY_CB_OPEN_WAIT: "15s"
  SOCIETY_CB_HALF_OPEN_CALLS: "2"
  SOCIETY_RETRY_MAX_ATTEMPTS: "3"
  SOCIETY_RETRY_INITIAL_INTERVAL: "200ms"
  SOCIETY_RETRY_MULTIPLIER: "2.0"
  SOCIETY_RETRY_JITTER: "0.2"
  SOCIETY_RETRY_MAX_INTERVAL: "1s"
  SOCIETY_BULKHEAD_MAX_CONCURRENT: "12"
  SOCIETY_BULKHEAD_MAX_WAIT: "0ms"
  MEMBER_HTTP_MAX_THREADS: "100"
  MEMBER_HTTP_MAX_CONNECTIONS: "500"
  MEMBER_HTTP_ACCEPT_COUNT: "50"
