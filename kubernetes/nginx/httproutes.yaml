apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emerald-http-to-https
  namespace: emerald-housing
spec:
  parentRefs:
    - name: emerald-edge
      sectionName: http
  hostnames:
    - emerald.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 308
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emerald-api-to-spring-gateway
  namespace: emerald-housing
spec:
  parentRefs:
    - name: emerald-edge
      sectionName: https
  hostnames:
    - emerald.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: api-gateway
          port: 8080
          weight: 1
