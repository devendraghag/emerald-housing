name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Member Service tests (including Testcontainers integrations)
        run: ./services/member-service/mvnw -B -f services/member-service/pom.xml test
      - name: Society Service tests (including Testcontainers integrations)
        run: ./services/member-service/mvnw -B -f services/society-service/pom.xml test
      - name: API Gateway tests
        run: ./services/member-service/mvnw -B -f infrastructure/api-gateway/pom.xml test

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack and run Postman Gateway assertions
        run: docker compose -p emerald-housing-ci -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e-test
      - name: Remove the isolated test stack
        if: always()
        run: docker compose -p emerald-housing-ci -f docker-compose.e2e.yml down --volumes --remove-orphans
