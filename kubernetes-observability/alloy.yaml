apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: emerald-housing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-alloy-pod-logs
  namespace: emerald-housing
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-alloy-pod-logs
  namespace: emerald-housing
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: emerald-housing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-alloy-pod-logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy-config
  namespace: emerald-housing
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.kubernetes.pods.targets
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    otelcol.receiver.otlp "applications" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      output {
        traces = [otelcol.processor.batch.applications.input]
      }
    }

    otelcol.processor.batch "applications" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:4317"
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-alloy
  namespace: emerald-housing
  labels:
    app: grafana-alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          ports:
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: grafana-alloy-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: emerald-housing
spec:
  type: ClusterIP
  selector:
    app: grafana-alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otlp-ingress-from-applications
  namespace: emerald-housing
spec:
  podSelector:
    matchLabels:
      app: grafana-alloy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: member-service
        - podSelector:
            matchLabels:
              app: society-service
      ports:
        - protocol: TCP
          port: 4317
