apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
  - prometheus.yaml
  - loki.yaml
  - tempo.yaml
  - alloy.yaml
  - grafana.yaml
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: emerald-app-config
    patch: |-
      - op: replace
        path: /data/TRACING_OTLP_ENABLED
        value: "true"
  - target:
      version: v1
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/TRACING_OTLP_ENABLED
        value: "true"
